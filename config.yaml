#config.yaml - основные параметры проекта
project:
  name: VideoContentRanking
  version: 0.1.0

paths:
  data_dir: data
  raw_dir: data/raw
  audio_dir: data/audioVideoContent
  annotations_dir: data/annotations
  processed_dir: data/processed
  logs_dir: logs

ffmpeg:
  audio_format: wav
  audio_codec: pcm_s16le
  sample_rate: 16000

scene_detection:
  method: pyscenedetect
  content_detector_threshold: 30.0
  min_scene_len_sec: 0.5

asr:
  model_size: tiny
  device: cpu
  vad_filter: true
  compute_type: int8

audio_analysis:
  rms_hop_length: 512
  lufs_target: -23.0   # целевой LUFS при нормализации
  merge_speech_max_gap: 0.5

ranking:
  manual_annotation_file: data/annotations/manual_ranks.csv
  default_weights:
    speech_density: 0.4
    lufs: 0.2
    avg_rms: 0.15
    text_length: 0.15
    duration: 0.1

logging:
  level: INFO
  file: logs/app.log
