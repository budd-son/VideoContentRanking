video:
  input_path: "data/raw/demo.mp4"
  output_csv: "data/processed/demo_scenes.csv"

audio:
  sample_rate: 16000
  normalize: true

speech:
  model_size: "small"
  max_gap: 0.3

scenes:
  threshold: 30.0
  min_duration: 2.0

features:
  rms: true
  lufs: true
  zscore: true
  shot_density: true
paths:
  audio_out_dir: "data/audio/"

